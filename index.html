<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Love Letter for My Iris ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="love letter 2.css" />
</head>

<body>

    <!-- Envelope -->
    <div class="envlope-wrapper">
        <div id="envelope" class="close">

            <div class="front flap"></div>
            <div class="front pocket"></div>

            <div class="letter">
                <div class="words line1">To My Iris: Jelyy Ganda ❤️</div>
                <div class="words line2">Happy Monthsary, Lablab.</div>
                <div class="words line3">Sa bawat buwang ikaw ang kasama, aking puso ay kumakalma.</div>
                <div class="words line4">Ikaw ay laging pipiliin ko—ngayon, bukas, at magpakailanman.</div>
            </div>

            <div class="hearts">
                <div class="heart a1"></div>
                <div class="heart a2"></div>
                <div class="heart a3"></div>
            </div>

        </div>
    </div>

    <!-- Buttons -->
    <div class="reset">
        <button id="open">Open</button>
        <button id="reset">Close</button>
    </div>

   <!-- Background Music -->
<audio id="bgMusic" preload="auto">
    <source src="iris.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="love letter 2.js"></script>

</body>

</html>
